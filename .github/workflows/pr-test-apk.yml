# Every pull request: run the tests, build the website, and build a test APK
# ("FilaScribe Test", installs next to the release app) that can be
# downloaded from the PR.
name: PR test build

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: pr-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build web app
        env:
          BUILD_ID: pr${{ github.event.pull_request.number }}-${{ github.run_number }}
        run: npm run build

      - name: Copy web app into Android
        run: npx cap sync android

      - name: Build test APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: pr${{ github.event.pull_request.number || 'manual' }}.${{ github.run_number }}
        run: ./gradlew --no-daemon assembleDebug

      - name: Name the APK
        id: apk
        env:
          # The branch's own commit, not the temporary PR merge commit
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          name="FilaScribe-test-pr${{ github.event.pull_request.number || 'manual' }}-${HEAD_SHA::7}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Upload test APK
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
          retention-days: 30

      - name: Link the APK on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        env:
          APK_NAME: ${{ steps.apk.outputs.name }}
          APK_URL: ${{ steps.upload.outputs.artifact-url }}
        with:
          script: |
            const marker = '<!-- filascribe-test-apk -->';
            const body = [
              marker,
              `**Test APK:** [${process.env.APK_NAME}](${process.env.APK_URL})`,
              '',
              `Built from ${context.payload.pull_request.head.sha.slice(0, 7)}. GitHub downloads it as a .zip: open the zip on the phone and tap the APK inside.`,
              'It installs as "FilaScribe Test", next to the release app, and updates over earlier test APKs.',
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const old = comments.find((c) => c.body && c.body.includes(marker));
            if (old) await github.rest.issues.updateComment({ owner, repo, comment_id: old.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
