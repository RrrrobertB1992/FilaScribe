# Publishing a GitHub release (e.g. tag v0.1.0) builds the signed release APK
# and attaches it to that release. Needs the signing secrets in the README.
name: Release APK

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and attach the APK to (e.g. v0.1.0)
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Check signing secrets
        env:
          KS: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.RELEASE_KEY_ALIAS }}
          KP: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$KSP" ] || [ -z "$KA" ] || [ -z "$KP" ]; then
            echo "::error::Release signing secrets are missing. See 'Release signing' in the README."
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - run: npm ci
      - run: npm test

      - name: Build web app
        env:
          BUILD_COMMIT: ${{ github.sha }}
        run: BUILD_TAG="$TAG" npm run build

      - run: npx cap sync android

      - name: Build signed release APK
        working-directory: android
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          export RELEASE_KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RELEASE_KEYSTORE_FILE"
          # versionCode keeps rising across releases; versionName is the tag without "v"
          export VERSION_CODE=$(( 1000 + ${{ github.run_number }} ))
          export VERSION_NAME="${TAG#v}"
          ./gradlew --no-daemon assembleRelease
          rm -f "$RELEASE_KEYSTORE_FILE"

      - name: Attach APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="FilaScribe-${TAG}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$name"
          gh release upload "$TAG" "$name" --clobber
